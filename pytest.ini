[pytest]
pythonpath = .
testpaths = tests
addopts =
    -v
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --html=reports/report.html
    --self-contained-html
markers =
    api: API tests (no browser)
    ui: UI tests (browser)
    smoke: critical-path tests, quick confidence check